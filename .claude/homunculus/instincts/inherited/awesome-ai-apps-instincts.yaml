# Awesome Ai Apps Workflow Update Npm Dependencies Multi Package

## Action

Follow the update-npm-dependencies-multi-package workflow:
1. Identify outdated dependencies in multiple package.json files.
2. Update the version numbers in each package.json.
3. Regenerate the corresponding lock files (package-lock.json, pnpm-lock.yaml, etc.).
4. Commit all updated package.json and lock files together.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: **/package.json, **/package-lock.json, **/pnpm-lock.yaml

